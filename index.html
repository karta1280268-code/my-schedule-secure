<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans TC', sans-serif; }
    /* Custom scrollbar for event containers */
    .event-container::-webkit-scrollbar { width: 4px; }
    .event-container::-webkit-scrollbar-track { background: transparent; }
    .event-container::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased p-4 md:p-8 min-h-screen">
  <div class="max-w-6xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
    <!-- Header -->
    <div class="px-6 py-5 flex items-center justify-between border-b border-slate-100 bg-white">
      <h2 id="month-year" class="text-2xl font-bold text-slate-800 tracking-tight"></h2>
      <div class="flex items-center space-x-2 md:space-x-4">
        <button id="prev-month" class="p-2 rounded-full hover:bg-slate-100 text-slate-500 hover:text-slate-700 transition-colors focus:outline-none">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        </button>
        <button id="today-btn" class="px-4 py-2 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 font-semibold rounded-full transition-colors text-sm focus:outline-none">
          回到今天
        </button>
        <button id="next-month" class="p-2 rounded-full hover:bg-slate-100 text-slate-500 hover:text-slate-700 transition-colors focus:outline-none">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
        </button>
        <button onclick="window.print()" class="ml-2 p-2 rounded-full hover:bg-slate-100 text-slate-500 hover:text-slate-700 transition-colors focus:outline-none" title="列印為 PDF">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- Days Header -->
    <div class="grid grid-cols-7 border-b border-slate-100 bg-slate-50/80">
      <div class="py-3 text-center text-xs font-bold text-rose-500 uppercase tracking-widest">週日 (Sun)</div>
      <div class="py-3 text-center text-xs font-bold text-slate-500 uppercase tracking-widest">週一 (Mon)</div>
      <div class="py-3 text-center text-xs font-bold text-slate-500 uppercase tracking-widest">週二 (Tue)</div>
      <div class="py-3 text-center text-xs font-bold text-slate-500 uppercase tracking-widest">週三 (Wed)</div>
      <div class="py-3 text-center text-xs font-bold text-slate-500 uppercase tracking-widest">週四 (Thu)</div>
      <div class="py-3 text-center text-xs font-bold text-slate-500 uppercase tracking-widest">週五 (Fri)</div>
      <div class="py-3 text-center text-xs font-bold text-indigo-500 uppercase tracking-widest">週六 (Sat)</div>
    </div>

    <!-- Calendar Grid -->
    <div id="calendar-grid" class="grid grid-cols-7 bg-slate-200 gap-px">
      <!-- Cells injected by JS -->
    </div>
  </div>

  <script>
    window.CALENDAR_EVENTS = [{"date": "2026-09-01", "time": "18:00 - 19:00", "title": "學生A 英文"}, {"date": "2026-09-02", "time": "13:30 - 15:20", "title": "學校上課"}, {"date": "2026-09-03", "time": "18:00 - 19:00", "title": "學生A 數學"}, {"date": "2026-09-05", "time": "13:30 - 15:00", "title": "學生B 英文"}, {"date": "2026-09-05", "time": "15:00 - 16:00", "title": "學生B 理化"}, {"date": "2026-09-06", "time": "13:30 - 15:00", "title": "學生B 英文"}, {"date": "2026-09-06", "time": "15:00 - 16:00", "title": "學生B 理化"}, {"date": "2026-09-08", "time": "19:10 - 20:40", "title": "學生B 英文"}, {"date": "2026-09-09", "time": "13:30 - 15:20", "title": "學校上課"}, {"date": "2026-09-09", "time": "18:00 - 19:00", "title": "學生A 英文"}, {"date": "2026-09-10", "time": "18:00 - 19:00", "title": "學生A 數學"}, {"date": "2026-09-10", "time": "19:10 - 20:40", "title": "學生B 英文"}, {"date": "2026-09-11", "time": "19:00 - 21:00", "title": "學生B 理化"}, {"date": "2026-09-12", "time": "13:30 - 15:30", "title": "學生B 理化"}, {"date": "2026-09-15", "time": "18:00 - 19:00", "title": "學生A 英文"}, {"date": "2026-09-15", "time": "19:10 - 20:40", "title": "學生B 英文"}, {"date": "2026-09-16", "time": "13:30 - 15:20", "title": "學校上課"}, {"date": "2026-09-17", "time": "18:00 - 19:00", "title": "學生A 數學"}, {"date": "2026-09-17", "time": "19:10 - 20:40", "title": "學生B 英文"}, {"date": "2026-09-18", "time": "19:00 - 21:00", "title": "學生B 理化"}, {"date": "2026-09-19", "time": "13:30 - 15:30", "title": "學生B 理化"}, {"date": "2026-09-22", "time": "18:00 - 19:00", "title": "學生A 英文"}, {"date": "2026-09-22", "time": "19:10 - 20:40", "title": "學生B 英文"}, {"date": "2026-09-23", "time": "13:30 - 15:20", "title": "學校上課"}, {"date": "2026-09-23", "time": "15:30 - 17:30", "title": "論文研究"}, {"date": "2026-09-24", "time": "18:00 - 19:00", "title": "學生A 數學"}, {"date": "2026-09-24", "time": "19:10 - 20:40", "title": "學生B 英文"}, {"date": "2026-09-25", "time": "全天", "title": "適逢中秋節 視連假確認是否調課"}, {"date": "2026-09-25", "time": "19:00 - 21:00", "title": "學生B 理化"}, {"date": "2026-09-26", "time": "13:30 - 15:30", "title": "學生B 理化"}, {"date": "2026-09-29", "time": "18:00 - 19:00", "title": "學生A 英文"}, {"date": "2026-09-29", "time": "19:10 - 20:40", "title": "學生B 英文"}, {"date": "2026-09-30", "time": "13:30 - 15:20", "title": "學校上課"}];

    if (!window.CALENDAR_EVENTS) {
      window.CALENDAR_EVENTS = [];
    }

    let currentDate = new Date(2026, 8, 1); // default to Sep 2026 for now, or today if preferred
    // Let's actually set it to today, but if there's no data it might look empty. 
    // The user uploaded Sep 2026, let's keep it focused on the current actual date.
    currentDate = new Date();

    const colorMap = [
      { bg: 'bg-blue-50', text: 'text-blue-700', border: 'border-blue-200', highlight: 'bg-blue-400' },     // 0: 學生B
      { bg: 'bg-emerald-50', text: 'text-emerald-700', border: 'border-emerald-200', highlight: 'bg-emerald-400' }, // 1: 學校
      { bg: 'bg-amber-50', text: 'text-amber-700', border: 'border-amber-200', highlight: 'bg-amber-400' },   // 2: 學生A
      { bg: 'bg-purple-50', text: 'text-purple-700', border: 'border-purple-200', highlight: 'bg-purple-400' },   // 3: 論文
      { bg: 'bg-rose-50', text: 'text-rose-700', border: 'border-rose-200', highlight: 'bg-rose-400' },       // 4: 節日/取消
      { bg: 'bg-slate-50', text: 'text-slate-700', border: 'border-slate-200', highlight: 'bg-slate-400' }      // 5: 預設
    ];

    function getEventColor(title) {
      if (title.includes('學生A')) return colorMap[2];
      if (title.includes('學生B')) return colorMap[0];
      if (title.includes('學校')) return colorMap[1];
      if (title.includes('論文')) return colorMap[3];
      if (title.includes('中秋') || title.includes('放假') || title.includes('調課')) return colorMap[4];
      return colorMap[5];
    }

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      document.getElementById("month-year").textContent = `${year}年 ${month + 1}月`;

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const prevMonthDays = new Date(year, month, 0).getDate();

      const grid = document.getElementById("calendar-grid");
      grid.innerHTML = "";

      // Previous month days
      for (let i = firstDay - 1; i >= 0; i--) {
        grid.appendChild(createCell(prevMonthDays - i, true));
      }

      // Current month days
      const today = new Date();
      for (let i = 1; i <= daysInMonth; i++) {
        const isToday = (i === today.getDate() && month === today.getMonth() && year === today.getFullYear());
        const cellDate = `${year}-${String(month+1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
        grid.appendChild(createCell(i, false, isToday, cellDate));
      }

      // Next month days
      const totalCells = firstDay + daysInMonth;
      const remainingCells = (7 - (totalCells % 7)) % 7;
      if (remainingCells < 7 && totalCells % 7 !== 0) {
        for (let i = 1; i <= remainingCells; i++) {
          grid.appendChild(createCell(i, true));
        }
      }
    }

    function createCell(dayNumber, isOtherMonth, isToday = false, cellDate = null) {
      const cell = document.createElement("div");
      cell.className = "bg-white min-h-[130px] p-2 flex flex-col transition-colors group";
      
      if (isOtherMonth) {
        cell.classList.add("bg-slate-50/50");
      } else {
        cell.classList.add("hover:bg-slate-50");
      }

      // Header (Day Number)
      const header = document.createElement("div");
      header.className = "flex justify-end mb-1";
      
      const daySpan = document.createElement("div");
      daySpan.textContent = dayNumber;
      daySpan.className = "w-7 h-7 flex items-center justify-center rounded-full text-sm font-medium transition-all";
      
      if (isToday) {
        daySpan.className += " bg-indigo-600 text-white shadow-md ring-4 ring-indigo-50";
      } else if (isOtherMonth) {
        daySpan.className += " text-slate-300";
      } else {
        daySpan.className += " text-slate-700 group-hover:text-indigo-600";
      }
      
      header.appendChild(daySpan);
      cell.appendChild(header);

      // Events
      const eventsContainer = document.createElement("div");
      eventsContainer.className = "flex-1 event-container overflow-y-auto flex flex-col gap-1.5";
      
      if (!isOtherMonth && cellDate) {
        const dayEvents = window.CALENDAR_EVENTS.filter(e => e.date === cellDate);
        dayEvents.sort((a, b) => (a.time || "").localeCompare(b.time || ""));

        dayEvents.forEach(evt => {
          const evtDiv = document.createElement("div");
          const colors = getEventColor(evt.title);
          
          evtDiv.className = `flex flex-col text-[12px] leading-snug p-1.5 rounded-md border ${colors.bg} ${colors.text} ${colors.border} shadow-sm`;
          
          let innerHTML = "";
          if (evt.time && evt.time !== "全天") {
            const timeStr = evt.time.split(' ')[0]; // Only take the start time for brevity if it's long
            innerHTML += `<div class="font-bold tracking-wide opacity-80 mb-0.5 flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full ${colors.highlight}"></span>${evt.time}</div>`;
          }
          innerHTML += `<div class="font-medium">${evt.title}</div>`;
          
          evtDiv.innerHTML = innerHTML;
          evtDiv.title = `${evt.time ? evt.time + ' ' : ''}${evt.title}`;
          
          eventsContainer.appendChild(evtDiv);
        });
      }
      
      cell.appendChild(eventsContainer);
      return cell;
    }

    document.getElementById("prev-month").addEventListener("click", () => {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    });
    document.getElementById("next-month").addEventListener("click", () => {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    });
    document.getElementById("today-btn").addEventListener("click", () => {
      currentDate = new Date();
      renderCalendar();
    });

    renderCalendar();
  </script>
</body>
</html>
